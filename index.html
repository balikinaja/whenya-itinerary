const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'Rp '+Number(n||0).toLocaleString('id-ID'),iso=d=>{let x=new Date(d);return Number.isNaN(x.getTime())?'':x.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})};

let data;try{data=JSON.parse(localStorage.getItem('voyage_v1'))||structuredClone(seed)}catch{data=structuredClone(seed)};let tab='home',selectedDay=data.trip.start;let activeTripId=null,tripList=[],cloudReady=false,cloudUser=null,cloudSaving=false,tripFilter='all',budgetView='expenses';let saveQueue=Promise.resolve();let tripMeta=null,joinRequests=[];let receiptDraft=null;let pendingWrites=0,remoteRevision=null,liveTripStop=null,liveListStop=null;let editingBase=null,saveError=false;let memberProfiles={};

 const id=activeTripId,snapshot=structuredClone(data);
 pendingWrites++;cloudSaving=true;
 const label=document.getElementById('clouduser');if(label)label.textContent='☁ Menyimpan…';

     editingBase=structuredClone(merged);

     }
   }
   saveError=false;
 }).catch(e=>{

   alert('Perubahan belum tersimpan: '+e.message+'\nData yang belum tersimpan masih ada di layar. Jangan refresh sebelum diperiksa.');
 }).finally(()=>{
   pendingWrites=Math.max(0,pendingWrites-1);cloudSaving=pendingWrites>0;
   if(!pendingWrites){
     if(remoteRevision&&activeTripId===id&&!saveError)applyRemoteRevision();

   }
 });
};
function applyRemoteRevision(){if(!remoteRevision||pendingWrites||saveError||document.getElementById('modalRoot').children.length)return;const r=remoteRevision;remoteRevision=null;if(r.deletedAt){if(activeTripId===r.id){if(liveTripStop){liveTripStop();liveTripStop=null}activeTripId=null;const next=tripList.find(t=>!t.deletedAt&&t.id!==r.id);if(next)switchTrip(next.id).catch(console.error);else{tab='history';tripFilter='deleted';render()}}return;}if(r.id!==activeTripId||!r.payload)return;const prev=selectedDay;data=structuredClone(r.payload);editingBase=structuredClone(r.payload);tripMeta={ownerId:r.ownerId,memberIds:r.memberIds||[]};memberProfiles=r.memberProfiles||{};ensureV3();selectedDay=days().some(([d])=>d===prev)?prev:data.trip.start;render();}
function receiveLiveTrip(r){if(!r||r.id!==activeTripId)return;if(r._pendingLocal)return;remoteRevision=r;applyRemoteRevision();}
function receiveLiveTrips(items){tripList=items;if(tab==='history')render();if(activeTripId&&!items.some(t=>t.id===activeTripId&&!t.deletedAt)){if(!pendingWrites){const next=items.find(t=>!t.deletedAt);if(next)switchTrip(next.id).catch(console.error);else{activeTripId=null;tab='history';tripFilter='deleted';render();}}}}
function closeLiveListeners(){if(liveTripStop){liveTripStop();liveTripStop=null}if(liveListStop){liveListStop();liveListStop=null}remoteRevision=null;}

function ensureV3(){if(!data.trip.status)data.trip.status='upcoming';if(!Array.isArray(data.trip.travelers))data.trip.travelers=['Aku'];if(!Array.isArray(data.settlements))data.settlements=[];if(!Array.isArray(data.expenses))data.expenses=[];}
function statusOf(t){if(t.status==='completed')return 'completed';let now=new Date().toISOString().slice(0,10);return now<t.start?'upcoming':now>t.end?'ended':'ongoing'}
function statusLabel(s){return ({upcoming:'Upcoming',ongoing:'Ongoing',ended:'Perlu diselesaikan',completed:'Completed'})[s]||s}
function coverFor(destination){let d=(destination||'').toLowerCase();if(/jogja|yogya/.test(d))return 'https://images.unsplash.com/photo-1584810359583-96fc3448beaa?w=1200&q=85';if(/bali|ubud/.test(d))return 'https://images.unsplash.com/photo-1537996194471-e657df975ab4?w=1200&q=85';if(/bandung/.test(d))return 'https://images.unsplash.com/photo-1500534623283-312aade485b7?w=1200&q=85';return 'https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=1200&q=85'}
function expenseSplit(e){let names=data.trip.travelers||[];let paid=e.paidBy||names[0];let participants=Array.isArray(e.splitWith)&&e.splitWith.length?e.splitWith.filter(x=>names.includes(x)):names.slice();return {paid,participants};}
function calcBalances(){let names=data.trip.travelers||[],balances=Object.fromEntries(names.map(x=>[x,0]));for(let e of data.expenses){let {paid,participants}=expenseSplit(e),amt=Number(e.amount)||0;if(!participants.length||!names.includes(paid))continue;balances[paid]+=amt;let each=amt/participants.length;for(let n of participants)balances[n]-=each;}for(let x of data.settlements||[]){if(balances[x.from]===undefined||balances[x.to]===undefined)continue;let amount=Number(x.amount)||0;balances[x.from]+=amount;balances[x.to]-=amount;}return balances;}
function settlePlan(){let b=calcBalances(),credit=Object.entries(b).filter(x=>x[1]>.01).map(([name,v])=>({name,v})),debt=Object.entries(b).filter(x=>x[1]<-.01).map(([name,v])=>({name,v:-v})),out=[];for(let d of debt)for(let c of credit){let amt=Math.min(d.v,c.v);if(amt>.01){out.push({from:d.name,to:c.name,amount:Math.round(amt)});d.v-=amt;c.v-=amt;}}return out;}
function showTripDirectory(){let options=[['all','Semua'],['upcoming','Upcoming'],['ongoing','Ongoing'],['completed','Completed'],['deleted','Recently Deleted']];let filtered=tripList.filter(t=>tripFilter==='deleted'?!!t.deletedAt:!t.deletedAt&&(tripFilter==='all'||(tripFilter==='ongoing'?['ongoing','ended'].includes(statusOf(t)):statusOf(t)===tripFilter)));return `<div class="eyebrow" style="margin-top:18px">YOUR TRAVEL COLLECTION</div>${heading('My Trips & History','+ Trip Baru','createNewTrip()')}<div class="v3-tabs">${options.map(([id,label])=>`<button class="${tripFilter===id?'active':''}" onclick="tripFilter='${id}';render()">${label}</button>`).join('')}</div><div class="v3-list">${filtered.map(t=>`<div class="v3-trip" style="position:relative"><button style="border:0;background:none;text-align:left;width:calc(100% - 45px);padding:0;color:inherit" onclick="switchTrip('${esc(t.id)}')" ${t.deletedAt?'disabled':''}><span class="v3-status">${t.deletedAt?'Recently Deleted':statusLabel(statusOf(t))}</span><strong style="margin-top:9px">${esc(t.destination)}</strong><small>${iso(t.start)} – ${iso(t.end)}</small><div class="tiny" style="margin-top:8px">${t.deletedAt?'Dapat dipulihkan':'Buka perjalanan dan laporan →'}</div></button>${t.ownerId===cloudUser?.uid?`<button class="icon-btn" aria-label="Kelola trip" style="position:absolute;right:12px;top:12px" onclick="manageTrip('${esc(t.id)}')">•••</button>`:''}</div>`).join('')||'<div class="empty">Belum ada perjalanan di kategori ini.</div>'}</div><button class="secondary wide" style="margin-top:12px" onclick="tab='home';render()">Kembali ke perjalanan aktif</button>`}

function tripPicker(){return `<div class="trip-actions"><button onclick="openDirectory()">✦ My Trips (${tripList.filter(x=>!x.deletedAt).length}) ▾</button><button onclick="createNewTrip()">＋ Trip Baru</button><button onclick="shareTrip()">♧ Bagikan Trip</button><button onclick="exportTripPdf()">⇩ Export PDF</button>${localStorage.getItem('voyage_v1')&&!localStorage.getItem('voyage_migrated_v2')?'<button onclick="importOldTrip()">⇧ Impor data lama</button>':''}</div>`}
function openTripPicker(){modal('My Trips',`<p class="muted">Pilih perjalanan yang ingin dibuka.</p><div class="field"><select class="tripselect" id="tripChoice">${tripList.filter(x=>!x.deletedAt).map(x=>`<option value="${esc(x.id)}" ${x.id===activeTripId?'selected':''}>${esc(x.destination||'Trip')} · ${esc(x.start||'')}</option>`).join('')}</select></div><button class="primary wide" onclick="switchTrip(val('tripChoice'))">Buka Perjalanan</button><button class="secondary wide" style="margin-top:8px" onclick="createNewTrip()">+ Buat Perjalanan Baru</button>`) }
async function switchTrip(id){if(!id||tripList.find(x=>x.id===id)?.deletedAt)return;await saveQueue.catch(()=>{});closeModal();if(liveTripStop){liveTripStop();liveTripStop=null}remoteRevision=null;activeTripId=id;let record=await window.voyageCloud.loadTrip(id);data=record.payload;editingBase=structuredClone(record.payload);tripMeta=record.meta;memberProfiles=record.meta.memberProfiles||{};selectedDay=data.trip.start;ensureV3();tab='home';render();liveTripStop=window.voyageCloud.watchTrip(id,receiveLiveTrip,e=>{console.error('Realtime trip:',e);document.getElementById('clouduser').textContent='⚠ Sinkronisasi terputus';});if(cloudUser?.uid===tripMeta?.ownerId)loadJoinRequests();window.voyageCloud.publishProfile(id).catch(e=>console.warn('Profil Google belum bisa dibagikan:',e.message));}

function manageTrip(id){const t=tripList.find(x=>x.id===id);if(!t||t.ownerId!==cloudUser?.uid)return alert('Hanya pemilik trip yang dapat mengelola perjalanan.');if(t.deletedAt){modal('Recently Deleted',`<p class="muted">${esc(t.destination)} — trip ini belum dihapus permanen.</p><button class="primary wide" onclick="restoreTrip('${esc(id)}')">Pulihkan Trip</button>`);return;}modal('Kelola Trip',`<p class="muted">${esc(t.destination)}</p><div class="v3-action"><button class="secondary" onclick="editDirectoryTrip('${esc(id)}')">✎ Edit Trip</button><button class="secondary" onclick="duplicateTrip('${esc(id)}')">⧉ Duplicate Trip</button><button class="secondary" onclick="deleteTrip('${esc(id)}')">♧ Delete Trip</button></div>`)}
async function editDirectoryTrip(id){try{await switchTrip(id);openTrip()}catch(e){alert('Gagal membuka trip: '+e.message)}}
async function duplicateTrip(id){const t=tripList.find(x=>x.id===id);if(!t||t.ownerId!==cloudUser?.uid)return alert('Hanya pemilik trip yang dapat menduplikasi.');try{await saveQueue.catch(()=>{});const record=await window.voyageCloud.loadTrip(id);const copy=structuredClone(record.payload);copy.trip.destination+=' (Copy)';copy.trip.status='upcoming';delete copy.trip.completedAt;const newId=await window.voyageCloud.createTrip(copy);closeModal();await refreshTrips(newId);alert('Trip berhasil diduplikasi.')}catch(e){alert('Gagal menduplikasi: '+e.message)}}
async function deleteTrip(id){const t=tripList.find(x=>x.id===id);if(!t||t.ownerId!==cloudUser?.uid)return alert('Hanya pemilik trip yang dapat menghapus.');if(!confirm('Pindahkan "'+t.destination+'" ke Recently Deleted? Trip dapat dipulihkan.'))return;try{await saveQueue.catch(()=>{});await window.voyageCloud.softDeleteTrip(id);closeModal();if(activeTripId===id)activeTripId=null;await refreshTrips();openDirectory('all')}catch(e){alert('Gagal menghapus: '+e.message)}}

function activityConflicts(a){if(!a?.endTime||!a.time)return [];return data.activities.filter(b=>b.id!==a.id&&b.date===a.date&&b.endTime&&b.time&&a.time<b.endTime&&b.time<a.endTime)}
function exportTripPdf(){if(!activeTripId)return alert('Pilih trip terlebih dahulu.');const win=window.open('','_blank');if(!win)return alert('Izinkan pop-up untuk ekspor PDF.');const safe=x=>esc(x);const activities=data.activities.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));const spent=data.expenses.reduce((sum,e)=>sum+(Number(e.amount)||0),0);const body=`<h1>VOYAGE · ${safe(data.trip.destination)}</h1><p>${iso(data.trip.start)} – ${iso(data.trip.end)}</p><p>Travelers: ${(data.trip.travelers||[]).map(safe).join(', ')}</p><h2>Itinerary</h2>${activities.map(a=>`<section><strong>${safe(a.date)} · ${safe(a.time)}${a.endTime?'–'+safe(a.endTime):''} — ${safe(a.title)}</strong><p>${safe(a.location||'')} · ${safe(a.category||'')}</p><small>${safe(a.note||'')}</small></section>`).join('')||'<p>Belum ada aktivitas.</p>'}<h2>Budget</h2><p>Anggaran: ${money(data.trip.budget)} · Pengeluaran: ${money(spent)}</p>${data.expenses.map(e=>`<section>${safe(e.title)} — ${money(e.amount)}</section>`).join('')}<h2>Packing</h2>${data.packing.map(p=>`<p>${p.done?'☑':'☐'} ${safe(p.title)}</p>`).join('')}`;win.document.open();win.document.write('<!doctype html><html lang="id"><head><meta charset="utf-8"><title>VOYAGE Itinerary</title><style>body{font:14px Arial,sans-serif;color:#172a33;max-width:850px;margin:35px auto;padding:0 22px}h1{font-size:28px}h2{margin-top:28px;border-bottom:1px solid #ddd;padding-bottom:8px}section{padding:10px 0;border-bottom:1px solid #eee}small{color:#777}@media print{body{margin:10mm auto}}</style></head><body>'+body+'</body></html>');win.document.close();win.focus();setTimeout(()=>win.print(),350)}
function createNewTrip(){modal('Trip Baru',field('newdest','Destinasi','text','Yogyakarta, Indonesia')+field('newstart','Tanggal mulai','date','2026-12-20')+field('newend','Tanggal selesai','date','2026-12-23')+field('newbudget','Budget (Rp)','number',5000000)+`<button class="primary wide" onclick="submitNewTrip()">Buat Trip</button>`)}

async function importOldTrip(){if(!confirm('Impor salinan perjalanan lama dari browser ini ke Firebase? Data lama tidak akan dihapus.'))return;let old;try{old=JSON.parse(localStorage.getItem('voyage_v1'))}catch{};if(!old?.trip)return alert('Data lama tidak ditemukan.');try{let id=await window.voyageCloud.createTrip(old);localStorage.setItem('voyage_migrated_v2','1');await refreshTrips(id);closeModal();alert('Perjalanan lama berhasil disalin ke Firebase.')}catch(e){alert(e.message)}}
async function refreshTrips(preferred){tripList=await window.voyageCloud.listTrips();if(!tripList.length){const fresh={trip:{destination:'Yogyakarta, Indonesia',start:'2026-12-20',end:'2026-12-23',budget:5000000,travelers:['Aku'],status:'upcoming'},activities:[],expenses:[],packing:[],settlements:[]};const id=await window.voyageCloud.createTrip(fresh);tripList=await window.voyageCloud.listTrips();if(!tripList.some(t=>t.id===id))throw Error('Trip dibuat tetapi belum dapat dibaca dari Firestore');preferred=id;}const next=preferred||(activeTripId&&tripList.some(t=>t.id===activeTripId&&!t.deletedAt)?activeTripId:tripList.find(t=>!t.deletedAt)?.id);if(next)await switchTrip(next);else{activeTripId=null;data=structuredClone(seed);tab='history';tripFilter='deleted';render()}document.getElementById('clouduser').textContent=''}

const icon=(name)=>({home:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',wallet:'<rect x="3" y="5" width="18" height="15" rx="2"/><path d="M15 11h6v5h-6a2 2 0 0 1 0-5z"/>',check:'<path d="M4 12l5 5L20 6"/><path d="M4 4h8M4 20h16"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 5a3 3 0 0 1 0 6M17 14a5 5 0 0 1 4 5"/>'})[name];function memberAvatar(p,cls='member-photo'){const name=p?.displayName||p?.email||'Anggota';const initials=name.trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();const url=typeof p?.photoURL==='string'&&/^https:\/\//i.test(p.photoURL)?p.photoURL:'';return url?`<img class="${cls}" src="${esc(url)}" alt="Foto profil ${esc(name)}" referrerpolicy="no-referrer" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="${cls} member-initial" hidden>${esc(initials)}</span>`:`<span class="${cls} member-initial">${esc(initials)}</span>`;}function linkedProfileAt(i){const uid=(data.trip.travelerAccountIds||[])[i];return uid?(memberProfiles[uid]||(uid===cloudUser?.uid?{displayName:cloudUser.displayName,email:cloudUser.email,photoURL:cloudUser.photoURL}:null)):null;}
function travelerCard(name,i){const uid=(data.trip.travelerAccountIds||[])[i],p=linkedProfileAt(i),isOwner=uid&&uid===tripMeta?.ownerId;return `<div class="card row"><div class="row" style="justify-content:flex-start;min-width:0">${uid?memberAvatar(p||{displayName:name},'member-photo'):`<span class="member-photo member-initial">${esc(name.trim().slice(0,1).toUpperCase())}</span>`}<div style="min-width:0"><strong>${esc(name)}</strong><div class="tiny">${uid?(p?.email?esc(p.email):'Akun terhubung · menunggu profil'):'Belum dihubungkan ke akun Google'}${isOwner?' · Owner':uid?' · Member':''}</div></div></div><button class="icon-btn" onclick="openTraveler(${i})" aria-label="Edit anggota">✎</button></div>`;}
function linkTravelerSelect(index){if(cloudUser?.uid!==tripMeta?.ownerId)return '';const ids=[tripMeta.ownerId,...(tripMeta.memberIds||[])].filter((v,i,a)=>v&&a.indexOf(v)===i);const current=(data.trip.travelerAccountIds||[])[index]||'';return `<div class="field"><label>Hubungkan akun Google (opsional)</label><select id="linkedAccount"><option value="">Belum dihubungkan</option>${ids.map(uid=>{const p=memberProfiles[uid]||(uid===cloudUser?.uid?cloudUser:null);return `<option value="${esc(uid)}" ${uid===current?'selected':''}>${esc(p?.displayName||p?.email||'Akun belum memuat profil')} ${uid===tripMeta.ownerId?'(Owner)':''}</option>`}).join('')}</select><div class="tiny" style="margin-top:7px">Pilih akun yang benar. Foto mengikuti akun Google yang dipilih.</div></div>`;}

function renderConnectedMembers(){if(!tripMeta)return '';const ids=[tripMeta.ownerId,...(tripMeta.memberIds||[])].filter((v,i,a)=>v&&a.indexOf(v)===i);return `<div class="card"><div class="row"><strong>Profil Google Terhubung</strong><span class="v3-status">${ids.length} akun</span></div><p class="muted">Foto otomatis dari akun Google masing-masing. Anggota perlu membuka VOYAGE sekali setelah pembaruan agar fotonya tampil.</p>${ids.map(uid=>{const p=memberProfiles[uid]||(uid===cloudUser?.uid?{displayName:cloudUser.displayName,email:cloudUser.email,photoURL:cloudUser.photoURL}:null);return `<div class="member-line">${memberAvatar(p||{displayName:'?'})}<div class="member-detail"><strong>${esc(p?.displayName||'Menunggu profil Google')}</strong><small>${esc(p?.email||'Foto muncul setelah anggota membuka aplikasi')}</small></div><span class="member-role">${uid===tripMeta.ownerId?'Owner':'Member'}</span></div>`}).join('')}</div>`;}function renderNav(){$('#nav').innerHTML=[['home','Home'],['calendar','Itinerary'],['wallet','Budget'],['check','Packing'],['users','Family']].map(([id,label])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')"><svg viewBox="0 0 24 24">${icon(id)}</svg>${label}</button>`).join('')};function go(t){tab=t;render();scrollTo({top:0,behavior:'smooth'})};function heading(title,action='',fn=''){return `<div class="section-head"><h2>${title}</h2>${action?`<button class="link" onclick="${fn}">${action} ↗</button>`:''}</div>`};function activity(a){return `<div class="card activity"><div class="time" style="min-width:76px">${esc(a.time)}${a.endTime?`<div style="font-size:10px;color:var(--muted);margin-top:4px">s/d ${esc(a.endTime)}</div>`:''}</div><div class="activity-body"><h3>${esc(a.title)}</h3><p>📍 ${esc(a.location||'Lokasi belum diisi')}</p>${a.note?`<p style="margin-top:5px">${esc(a.note)}</p>`:''}${a.endTime?`<div class="tiny" style="margin-top:7px">⏱ ${activityDuration(a.time,a.endTime)}</div>`:''}<span class="chip">${esc(a.category)}</span>${activityConflicts(a).length?`<span class="chip" style="background:#fff0e7;color:#a44725;margin-left:5px">⚠ Jadwal bentrok</span>`:''}</div><div style="display:grid;gap:6px"><button class="icon-btn" aria-label="Edit aktivitas" onclick="openActivity(${a.id})">✎</button>${a.location?`<button class="icon-btn" aria-label="Buka peta" onclick="window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(${JSON.stringify(a.location)}),'_blank','noopener')">↗</button>`:''}</div></div>`};function activityDuration(start,end){if(!start||!end)return '';const [sh,sm]=start.split(':').map(Number),[eh,em]=end.split(':').map(Number),minutes=(eh*60+em)-(sh*60+sm);if(minutes<=0)return '';return `${Math.floor(minutes/60)?Math.floor(minutes/60)+' jam ':''}${minutes%60?minutes%60+' menit':''}`.trim()}function days(){const arr=[];let d=new Date(data.trip.start+'T12:00:00'),end=new Date(data.trip.end+'T12:00:00');for(let i=0;i<31&&d<=end;i++,d.setDate(d.getDate()+1))arr.push([d.toISOString().slice(0,10),i+1]);return arr};function render(){ensureV3();renderNav();let t=data.trip,spent=data.expenses.reduce((a,b)=>a+Number(b.amount),0),daysLeft=Math.max(0,Math.ceil((new Date(t.start+'T00:00:00')-new Date())/86400000)),done=data.packing.filter(p=>p.done).length;let html='';if(tab==='history'){html=showTripDirectory()}else if(tab==='home'){html=`${tripPicker()}<div class="row" style="margin:10px 0 16px"><div><div class="eyebrow">WELCOME TO YOUR ESCAPE</div><h2 style="font:600 26px 'Playfair Display',serif;margin:6px 0">Petualangan berikutnya ✨</h2></div><button class="icon-btn" onclick="openTrip()" aria-label="Edit perjalanan">✎</button></div><div class="hero" style="background-image:linear-gradient(180deg,rgba(5,20,25,.02),rgba(4,21,27,.8)),url('${coverFor(t.destination)}')"><div class="hero-content"><div class="pill">✦ ${statusLabel(statusOf(t)).toUpperCase()} TRIP</div><h1>${esc(t.destination)}</h1><div class="hero-meta"><span>◷ ${iso(t.start)} – ${iso(t.end)}</span><span>♧ ${t.travelers.length} travelers</span></div></div></div><div class="stats"><div class="stat"><strong>${daysLeft}</strong><span>Hari lagi</span></div><div class="stat"><strong>${days().length}</strong><span>Hari liburan</span></div><div class="stat"><strong>${data.activities.length}</strong><span>Aktivitas</span></div></div><div class="card" style="margin-top:12px"><div class="row"><strong>Persiapan perjalanan</strong><span class="tiny">${done}/${data.packing.length} packing selesai</span></div><div class="progress"><div style="width:${data.packing.length?done/data.packing.length*100:0}%"></div></div><button class="link" onclick="go('check')">Lihat Packing →</button></div>${heading('Your Journey','Lihat semua',"go('calendar')")}<div class="card"><div class="eyebrow">TRIP OVERVIEW</div><p class="muted">${iso(t.start)} – ${iso(t.end)} · ${esc(t.travelers.join(', '))}</p><div class="row"><div><div class="tiny">Total budget</div><strong>${money(t.budget)}</strong></div><div style="text-align:right"><div class="tiny">Sisa budget</div><strong>${money(t.budget-spent)}</strong></div></div><div class="progress"><div style="width:${Math.min(100,spent/Math.max(1,t.budget)*100)}%"></div></div></div>${heading('Aktivitas terdekat','Tambah',"openActivity()")}${data.activities.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,2).map(activity).join('')||'<div class="empty">Belum ada aktivitas.</div>'}<div class="v3-action"><button class="secondary" onclick="openDirectory('completed')">◷ Trip History</button><button class="secondary" onclick="openSummary()">▤ Trip Summary</button><button class="secondary" onclick="toggleCompleted()">${t.status==='completed'?'↶ Buka Kembali':'✓ Tandai Completed'}</button></div><div class="banner"><h3>Every journey tells a story.</h3><p>Rencanakan momen kecil yang akan jadi kenangan besar bersama orang tersayang.</p></div>`}else if(tab==='calendar'){html=`<div style="margin-top:15px" class="eyebrow">YOUR DAILY PLANS</div>${heading('Trip Itinerary','+ Aktivitas','openActivity()')}<p class="muted">${esc(t.destination)} · ${iso(t.start)} – ${iso(t.end)}</p><div class="days">${days().map(([date,n])=>`<button class="day ${selectedDay===date?'active':''}" onclick="selectedDay='${date}';render()"><small>DAY ${n}</small><strong>${new Date(date+'T12:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short'})}</strong></button>`).join('')}</div>${heading(iso(selectedDay))}${data.activities.filter(a=>a.date===selectedDay).sort((a,b)=>a.time.localeCompare(b.time)).map(activity).join('')||'<div class="empty">Belum ada rencana hari ini. Yuk tambah aktivitas!</div>'}<button class="secondary wide" onclick="openActivity()">+ Tambah aktivitas hari ini</button>`}else if(tab==='wallet'){html=`<div style="margin-top:15px" class="eyebrow">KEEP YOUR SPENDING ON TRACK</div>${heading('Trip Budget','Edit budget','openTrip()')}<div class="card" style="padding:23px;background:var(--ink);color:white"><div style="font-size:11px;opacity:.65">Total budget perjalanan</div><div class="budget-total">${money(t.budget)}</div><div class="row"><div><div class="tiny">Terpakai</div><strong>${money(spent)}</strong></div><div style="text-align:right"><div class="tiny">Tersisa</div><strong>${money(t.budget-spent)}</strong></div></div><div class="progress" style="background:#46545a"><div style="width:${Math.min(100,spent/Math.max(1,t.budget)*100)}%"></div></div></div><div class="v3-tabs"><button class="${budgetView==='expenses'?'active':''}" onclick="budgetView='expenses';render()">Pengeluaran</button><button class="${budgetView==='split'?'active':''}" onclick="budgetView='split';render()">Split Bill</button><button onclick="openSummary()">Trip Summary</button></div>${budgetView==='split'?renderSplitBill():heading('Pengeluaran','+ Tambah','openExpense()')+`<button class="secondary wide" style="margin-bottom:12px" onclick="openReceipt()">📷 Scan / Upload Struk</button>`}${budgetView==='split'?'':data.expenses.map(e=>`<div class="card expense"><div><strong>${esc(e.title)}</strong><br><small>${esc(e.category)} · ${esc(expenseSplit(e).paid)} membayar${e.estimated!=null?` · Est. ${money(e.estimated)}`:''}</small></div><div style="text-align:right"><strong>${money(e.amount)}</strong><br>${e.receiptImage?`<button class="link" onclick="viewReceipt(${e.id})">Lihat struk</button>`:''}<button class="link" onclick="openExpense(${e.id})">Edit</button></div></div>`).join('')||'<div class="empty">Belum ada pengeluaran.</div>'}` }else if(tab==='check'){html=`<div style="margin-top:15px" class="eyebrow">READY, SET, GO</div>${heading('Packing List','+ Tambah','openPacking()')}<button class="secondary wide" style="margin-bottom:12px" onclick="openPackingTemplate()">✦ Gunakan Template Packing</button><p class="muted">${done} dari ${data.packing.length} barang sudah disiapkan.</p><div class="progress"><div style="width:${data.packing.length?done/data.packing.length*100:0}%"></div></div>${data.packing.map(p=>`<div class="card row"><label class="check ${p.done?'done':''}"><input type="checkbox" ${p.done?'checked':''} onchange="togglePack(${p.id},this.checked)"><span>${esc(p.title)}</span></label><button class="icon-btn" onclick="openPacking(${p.id})">✎</button></div>`).join('')||'<div class="empty">Checklist masih kosong.</div>'}` }else{html=`<div style="margin-top:15px" class="eyebrow">BETTER TOGETHER</div>${heading('Travel Companions','+ Tambah','openTraveler()')}<p class="muted">Orang-orang yang ikut dalam perjalanan ini.</p>${t.travelers.map((p,i)=>travelerCard(p,i)).join('')}<div class="card"><div class="row"><strong>Foto Profil Google</strong><span class="v3-status">${[tripMeta?.ownerId,...(tripMeta?.memberIds||[])].filter(Boolean).length} akun</span></div><p class="muted">Foto akan tampil pada nama traveler setelah akun dihubungkan melalui tombol edit. Jika foto Google baru diganti, tekan tombol di bawah dari akun masing-masing.</p><button id="refreshGooglePhoto" class="secondary wide" onclick="refreshMyGooglePhoto()">↻ Perbarui Foto Google</button></div><div class="card"><strong>Kolaborasi Grup</strong><p class="muted">Bagikan tautan, anggota login Google dan ajukan bergabung. Pemilik menyetujui permintaan.</p><button class="primary wide" onclick="shareTrip()">Bagikan undangan WhatsApp</button><div id="requestsBox" class="v31-note">${joinRequests.length?joinRequests.map(r=>`<div class="row"><span>${esc(r.email||r.uid)}</span><button class="secondary" onclick="approveMember('${esc(r.uid)}')">Setujui</button></div>`).join(''):'Belum ada permintaan bergabung.'}</div><button class="link" onclick="loadJoinRequests()">Refresh permintaan</button></div>`}$('#content').innerHTML=html};function toggleCompleted(){if(!confirm(data.trip.status==='completed'?'Buka kembali perjalanan ini?':'Tandai trip Completed dan simpan sebagai riwayat?'))return;data.trip.status=data.trip.status==='completed'?'upcoming':'completed';data.trip.completedAt=data.trip.status==='completed'?new Date().toISOString():null;save();render()}
function openSummary(){let total=data.expenses.reduce((a,e)=>a+(Number(e.amount)||0),0),balances=calcBalances(),pending=settlePlan().reduce((a,x)=>a+x.amount,0);modal('Trip Summary',`<div class="eyebrow">${esc(data.trip.destination)}</div><p class="muted">${iso(data.trip.start)} – ${iso(data.trip.end)} · ${statusLabel(statusOf(data.trip))}</p><div class="v3-summary"><div class="card"><div class="tiny">Total pengeluaran</div><strong>${money(total)}</strong></div><div class="card"><div class="tiny">Sisa budget</div><strong>${money(data.trip.budget-total)}</strong></div><div class="card"><div class="tiny">Aktivitas</div><strong>${data.activities.length}</strong></div><div class="card"><div class="tiny">Belum diselesaikan</div><strong>${money(pending)}</strong></div></div><p class="v3-label">SALDO PESERTA</p>${Object.entries(balances).map(([n,v])=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><span>${esc(n)}</span><strong>${v>=0?'Terima':'Bayar'} ${money(Math.abs(Math.round(v)))}</strong></div>`).join('')}<p class="muted">Ringkasan selalu dihitung dari pengeluaran dan transfer yang tercatat. Trip Completed tetap bisa dibuka dan diperbarui.</p><button class="primary wide" onclick="closeModal();go('wallet');budgetView='split';render()">Lihat Split Bill</button>`)}
function renderSplitBill(){let balances=calcBalances(),plan=settlePlan();return `<div class="card"><div class="eyebrow">GROUP EXPENSES</div><p class="muted">Pilih siapa yang membayar dan siapa saja yang ikut patungan saat menambah pengeluaran.</p><button class="primary wide" onclick="openExpense()">+ Catat Pengeluaran Bersama</button></div>${data.expenses.map(e=>`<div class="card"><div class="row"><strong>${esc(e.title)}</strong><strong>${money(e.amount)}</strong></div><p class="muted">Dibayar ${esc(expenseSplit(e).paid)} · Dibagi ${expenseSplit(e).participants.map(esc).join(', ')}</p>${e.receiptImage?`<button class="link" onclick="viewReceipt(${e.id})">Lihat struk</button>`:''}<button class="link" onclick="openExpense(${e.id})">Edit pembagian</button></div>`).join('')}<div class="card"><div class="eyebrow">SALDO PESERTA</div>${Object.entries(balances).map(([n,v])=>`<div class="row" style="padding:9px 0"><span>${esc(n)}</span><strong>${v>=0?'Terima':'Bayar'} ${money(Math.abs(Math.round(v)))}</strong></div>`).join('')}</div><div class="card"><div class="row"><strong>Siapa transfer ke siapa?</strong><button class="link" onclick="openSettlement()">+ Catat Transfer</button></div>${plan.map(x=>`<div class="v3-settle"><strong>${esc(x.from)} → ${esc(x.to)}</strong><div>${money(x.amount)}</div><button class="link" onclick="openSettlement('${encodeURIComponent(x.from)}','${encodeURIComponent(x.to)}',${x.amount})">Tandai dibayar</button></div>`).join('')||'<p class="muted">Semua saldo sudah seimbang.</p>'}${(data.settlements||[]).length?`<div class="v3-label">RIWAYAT TRANSFER</div>${data.settlements.map(x=>`<div class="row" style="padding:9px 0"><span>${esc(x.from)} → ${esc(x.to)}<br><small>${esc(x.date||'')}</small></span><span>${money(x.amount)} <button class="link" onclick="deleteSettlement('${esc(x.id)}')">Hapus</button></span></div>`).join('')}`:''}</div>`}
function openSettlement(from='',to='',amount=0){let names=data.trip.travelers;from=decodeURIComponent(from);to=decodeURIComponent(to);modal('Catat Pembayaran',`<p class="muted">Catat transfer yang benar-benar sudah dibayar. Jangan mencatat rencana transfer sebagai pembayaran.</p><div class="field"><label>Dari</label><select id="sfrom">${names.map(n=>`<option ${n===from?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="field"><label>Kepada</label><select id="sto">${names.map(n=>`<option ${n===to?'selected':''}>${esc(n)}</option>`).join('')}</select></div>${field('samount','Nominal transfer (Rp)','number',amount,'min="1"')}<button class="primary wide" onclick="saveSettlement()">Konfirmasi Sudah Dibayar</button>`)}
function saveSettlement(){let from=val('sfrom'),to=val('sto'),amount=Number(val('samount'));if(from===to||!Number.isFinite(amount)||amount<=0)return alert('Pilih dua orang berbeda dan nominal positif.');data.settlements.push({id:String(Date.now())+Math.random().toString(36).slice(2,6),from,to,amount,date:new Date().toISOString()});save();closeModal();render()}
function deleteSettlement(id){if(!confirm('Hapus catatan transfer ini?'))return;data.settlements=data.settlements.filter(x=>x.id!==id);save();render()}
function modal(title,body){$('#modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true"><div class="row"><h2>${title}</h2><button class="icon-btn" onclick="closeModal()">✕</button></div>${body}</div></div>`};function closeModal(){$('#modalRoot').innerHTML='';applyRemoteRevision()};function field(name,label,type='text',value='',extra=''){return `<div class="field"><label for="${name}">${label}</label><input id="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`};function val(id){return document.getElementById(id).value.trim()};function formButtons(saveCall,delCall){return `<div class="row"><button class="primary" style="flex:1" onclick="${saveCall}">Simpan Perubahan</button>${delCall?`<button class="secondary" onclick="${delCall}">Hapus</button>`:''}</div>`};function openTrip(){let t=data.trip;modal('Detail Perjalanan',field('destination','Destinasi','text',t.destination)+field('start','Tanggal mulai','date',t.start)+field('end','Tanggal selesai','date',t.end)+field('budget','Total budget (Rp)','number',t.budget,'min="0"')+formButtons('saveTrip()'))};function saveTrip(){let start=val('start'),end=val('end');if(!val('destination')||!start||!end||end<start)return alert('Isi destinasi dan rentang tanggal yang valid.');if(daysBetween(start,end)>30)return alert('Demo mendukung maksimal 31 hari perjalanan.');Object.assign(data.trip,{destination:val('destination'),start,end,budget:Math.max(0,Number(val('budget'))||0)});selectedDay=start;save();closeModal();render()};function daysBetween(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)};function openActivity(id){let a=data.activities.find(x=>x.id===id)||{date:selectedDay,time:'09:00',endTime:'10:00',title:'',location:'',note:'',category:'Wisata'};modal(id?'Edit Aktivitas':'Tambah Aktivitas',field('adate','Tanggal','date',a.date)+field('atime','Jam mulai','time',a.time)+field('aendtime','Jam selesai','time',a.endTime||'')+`<p class="tiny" style="margin:-3px 0 13px">Isi jam mulai dan jam selesai. Aktivitas lama yang belum punya jam selesai dapat dilengkapi saat diedit.</p>`+field('atitle','Nama aktivitas','text',a.title)+field('alocation','Lokasi / alamat','text',a.location)+`<div class="field"><label>Kategori</label><select id="acategory">${['Wisata','Transportasi','Kuliner','Akomodasi','Lainnya'].map(c=>`<option ${c===a.category?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Catatan</label><textarea id="anote">${esc(a.note)}</textarea></div>`+formButtons(`saveActivity(${id||0})`,id?`removeItem('activities',${id})`:''))};function saveActivity(id){if(!val('atitle')||!val('adate')||!val('atime'))return alert('Isi tanggal, jam, dan aktivitas.');if(val('aendtime')&&val('aendtime')<=val('atime'))return alert('Jam selesai harus lebih besar dari jam mulai pada hari yang sama.');if(val('adate')<data.trip.start||val('adate')>data.trip.end)return alert('Tanggal aktivitas harus berada dalam tanggal perjalanan.');let obj={id:id||Date.now(),date:val('adate'),time:val('atime'),endTime:val('aendtime'),title:val('atitle'),location:val('alocation'),category:val('acategory'),note:val('anote')};if(id)data.activities=data.activities.map(a=>a.id===id?obj:a);else data.activities.push(obj);selectedDay=obj.date;const conflicts=activityConflicts(obj);save();closeModal();render();if(conflicts.length)alert('⚠ Jadwal bertabrakan dengan: '+conflicts.map(x=>x.title).join(', ')+'. Aktivitas tetap disimpan.');};function openExpense(id){let e=data.expenses.find(x=>x.id===id)||{title:'',amount:'',estimated:'',category:'Kuliner'};let split=expenseSplit(e),names=data.trip.travelers;modal(id?'Edit Pengeluaran':'Tambah Pengeluaran',field('etitle','Nama pengeluaran','text',e.title)+field('eamount','Nominal aktual (Rp)','number',e.amount,'min="0"')+field('eestimated','Estimasi (Rp, opsional)','number',e.estimated??'','min="0"')+`<div class="field"><label>Kategori</label><select id="ecategory">${['Kuliner','Transportasi','Akomodasi','Wisata','Belanja','Lainnya'].map(c=>`<option ${c===e.category?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Dibayar oleh</label><select id="epaid">${names.map(n=>`<option ${n===split.paid?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="field"><label>Siapa saja yang ikut patungan?</label>${names.map(n=>`<label class="v3-check"><input type="checkbox" class="split-person" value="${esc(n)}" ${split.participants.includes(n)?'checked':''}><span>${esc(n)}</span></label>`).join('')}</div>`+formButtons(`saveExpense(${id||0})`,id?`removeItem('expenses',${id})`:''))};function saveExpense(id){if(!val('etitle')||val('eamount')===''||!Number.isFinite(Number(val('eamount')))||Number(val('eamount'))<0)return alert('Isi nama dan nominal yang valid.');let splitWith=[...document.querySelectorAll('.split-person:checked')].map(x=>x.value);if(!splitWith.length)return alert('Pilih minimal satu peserta yang ikut patungan.');if(val('eestimated')!==''&&(!Number.isFinite(Number(val('eestimated')))||Number(val('eestimated'))<0))return alert('Estimasi tidak valid.');let previous=data.expenses.find(x=>x.id===id);let obj={id:id||Date.now(),title:val('etitle'),amount:Number(val('eamount')),estimated:val('eestimated')===''?null:Number(val('eestimated')),category:val('ecategory'),paidBy:val('epaid'),splitWith,receiptImage:previous?.receiptImage||null};data.expenses=id?data.expenses.map(x=>x.id===id?obj:x):[...data.expenses,obj];save();closeModal();render()};

const packingTemplates={Pantai:['Pakaian renang','Sunscreen','Sandal','Topi','Kacamata hitam'],Kota:['Pakaian harian','Sepatu nyaman','Powerbank','Payung lipat'],Alam:['Jaket','Obat pribadi','Botol minum','Sepatu outdoor','Senter']};
function openPackingTemplate(){modal('Template Packing',`<p class="muted">Tambahkan checklist sesuai jenis perjalanan. Barang yang sudah ada tidak akan diduplikasi.</p><div class="v3-action">${Object.keys(packingTemplates).map(x=>`<button class="secondary" onclick="applyPackingTemplate('${x}')">${x}</button>`).join('')}</div>`)}
function applyPackingTemplate(type){const existing=new Set(data.packing.map(x=>x.title.trim().toLowerCase()));let added=0;for(const title of packingTemplates[type]||[]){if(existing.has(title.toLowerCase()))continue;data.packing.push({id:Date.now()+added+Math.floor(Math.random()*100000),title,done:false});added++}if(added)save();closeModal();render();alert(added+' barang ditambahkan ke Packing List.')}

async function compressReceipt(file){let bitmap=await createImageBitmap(file),canvas=document.createElement('canvas'),scale=Math.min(1,850/Math.max(bitmap.width,bitmap.height));canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();let quality=.45,url=canvas.toDataURL('image/jpeg',quality);while(url.length>120000&&quality>.15){quality-=.08;url=canvas.toDataURL('image/jpeg',quality)}if(url.length>150000)throw Error('Foto terlalu besar untuk penyimpanan versi ini');return url}
function parseReceipt(text){let lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean),candidates=[];for(let line of lines){if(!/total|grand total|jumlah bayar|total bayar|amount due|tagihan/i.test(line))continue;let matches=[...line.matchAll(/(?:rp\s*)?([0-9][0-9., ]{2,})/gi)];for(let m of matches){let raw=m[1].replace(/\s/g,''),value=Number(raw.replace(/[.,](?=\d{3}(?:[.,]|$))/g,'').replace(/[,]/g,'.'));if(Number.isFinite(value)&&value>0)candidates.push(value)}}return {amount:candidates.length?Math.max(...candidates):'',title:lines.find(x=>/[a-zA-Z]{4,}/.test(x))?.slice(0,60)||'Pembelian bersama'}}

function showReceiptResult(parsed,raw){document.getElementById('receiptResult').innerHTML=`<img class="receipt-preview" src="${receiptDraft||''}" alt="Pratinjau struk"><div class="field"><label>Nama pengeluaran (periksa)</label><input id="rtitle" value="${esc(parsed.title)}"></div><div class="field"><label>Total dibayar (Rp) — wajib dikonfirmasi</label><input id="ramount" type="number" min="1" value="${esc(parsed.amount)}"></div><div class="field"><label>Dibayar oleh</label><select id="rpayer">${data.trip.travelers.map(n=>`<option>${esc(n)}</option>`).join('')}</select></div><div class="field"><label>Siapa yang ikut patungan?</label>${data.trip.travelers.map(n=>`<label class="v3-check"><input type="checkbox" class="rmember" value="${esc(n)}" checked>${esc(n)}</label>`).join('')}</div><button class="primary wide" onclick="saveReceiptExpense()">Konfirmasi & Simpan Pengeluaran</button><details><summary class="muted">Lihat hasil baca OCR</summary><pre style="white-space:pre-wrap;font-size:10px">${esc(raw.slice(0,3000))}</pre></details>`}

function mergeTrip(base,local,remote){
 const merged=structuredClone(remote||{});const rootKeys=new Set([...Object.keys(base||{}),...Object.keys(local||{})]);

  const before=base?.[key],after=local?.[key],current=remote?.[key];
  if(equal(before,after))continue;

   merged.trip={...current};for(const field of new Set([...Object.keys(before),...Object.keys(after)])){
    if(equal(before[field],after[field]))continue;
    if(!equal(current[field],before[field])&&!equal(current[field],after[field]))throw Error('Ada perubahan bersamaan pada detail trip ('+field+'). Muat ulang trip sebelum mengedit lagi.');
    if(after[field]===undefined)delete merged.trip[field];else merged.trip[field]=structuredClone(after[field]);
   }continue;
  }
  if(Array.isArray(before)&&Array.isArray(after)&&Array.isArray(current)&&['activities','expenses','packing','settlements'].includes(key)){
   const result=new Map(current.map(x=>[String(x.id),structuredClone(x)]));
   const old=new Map(before.map(x=>[String(x.id),x]));
   const next=new Map(after.map(x=>[String(x.id),x]));
   for(const [id,item] of old){if(next.has(id)&&equal(item,next.get(id)))continue;
    const remoteItem=result.get(id);
    if(!next.has(id)){
     if(remoteItem!==undefined&&!equal(remoteItem,item))throw Error('Data '+key+' telah diubah di perangkat lain. Buka ulang trip sebelum menghapusnya.');

    }
   }
   for(const [id,item] of next){
    if(old.has(id)&&equal(old.get(id),item))continue;
    if(!old.has(id)){
      if(result.has(id)&&!equal(result.get(id),item))throw Error('ID data bentrok, silakan coba lagi.');
      result.set(id,structuredClone(item));continue;
    }
    const original=old.get(id),remoteItem=result.get(id);
    if(remoteItem===undefined)throw Error('Data '+key+' sudah dihapus di perangkat lain.');
    // Merge per field, not per whole item: checking a packing box must not
    // conflict with an unrelated change to the same list item.
    const nextItem=structuredClone(remoteItem);
    for(const field of new Set([...Object.keys(original),...Object.keys(item)])){
      if(equal(original[field],item[field]))continue;

      // idempotent and prevents false conflict alerts on rapid taps.
      if(key!=='packing'||field!=='done'){

   }

  }

  if(after===undefined)delete merged[key];else merged[key]=structuredClone(after);
 }
 return merged;
}

/* V3 WOW LAYER: hanya presentasi, tidak mengubah data/logika */
(()=>{

 function enhance(){
  const c=document.getElementById('content');if(!c)return;
  const entering=tab!==lastTab;lastTab=tab;
  c.classList.toggle('enter',entering);
  const hero=c.querySelector('.hero');
  if(hero&&!hero.querySelector('.cd')&&typeof statusOf==='function'&&statusOf(data.trip)==='upcoming'){
   const n=Math.max(0,Math.ceil((new Date(data.trip.start+'T00:00:00')-new Date())/86400000));
   const d=document.createElement('div');d.className='cd';d.innerHTML='<b>'+n+'</b><small>'+(n===0?'Berangkat hari ini':'hari lagi')+'</small>';hero.appendChild(d);
   if(entering&&n>0)countUp(d.firstChild,n,1400);
  }
  if(entering)c.querySelectorAll('.stat strong').forEach(el=>{const n=parseInt(el.textContent,10);if(!isNaN(n)&&n>0)countUp(el,n,900)});
 }
 if(typeof window.render==='function'){const r0=window.render;window.render=function(){const x=r0.apply(this,arguments);try{enhance()}catch(e){}return x};try{enhance()}catch(e){}}
 document.addEventListener('pointerdown',e=>{
  const b=e.target.closest&&e.target.closest('.primary,.trip-actions button,.icon-btn,.link,.nav button');if(!b||reduceMotion())return;
  const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)*2,i=document.createElement('span');
  i.className='rip';i.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(e.clientX-r.left-s/2)+'px;top:'+(e.clientY-r.top-s/2)+'px';
  b.appendChild(i);setTimeout(()=>i.remove(),700);
  if(b.classList.contains('primary')&&navigator.vibrate)navigator.vibrate(8);
 },{passive:true});

  const cv=document.createElement('canvas');cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99';
